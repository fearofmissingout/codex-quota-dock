name: Build desktop artifacts

on:
  push:
    branches:
      - main
      - "codex/**"
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

concurrency:
  group: build-desktop-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native-macos:
    name: Build native macOS ${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
          - arch: x86_64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test native macOS app
        if: matrix.arch == 'arm64'
        run: |
          cd native/macos/CodexQuotaDock
          swift test

      - name: Package native macOS app
        env:
          VERSION: "0.6.1"
        run: sh ./scripts/package-macos-native.sh "${{ matrix.arch }}"

      - name: Upload native macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-quota-dock-native-macos-${{ matrix.arch }}
          path: dist/codex-quota-dock-native-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  build-native-windows:
    name: Build native Windows amd64
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and test native Windows app
        shell: pwsh
        run: .\scripts\build-windows-native.ps1 -Configuration Release -Arch x64

      - name: Upload native Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-quota-dock-native-windows-amd64
          path: dist/codex-quota-dock-native-windows-amd64.zip
          if-no-files-found: error
