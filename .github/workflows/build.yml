name: Build desktop artifacts

on:
  push:
    branches:
      - main
      - "codex/**"
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

concurrency:
  group: build-desktop-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows amd64
            os: windows-latest
            artifact: codex-quota-dock-windows-amd64
            output: dist/codex-quota-dock-windows-amd64.exe
            upload_path: dist/codex-quota-dock-windows-amd64.exe
            goarch: amd64
          - name: macOS amd64
            os: macos-14
            artifact: codex-quota-dock-macos-amd64
            output: dist/codex-quota-dock-macos-amd64
            upload_path: dist/codex-quota-dock-macos-amd64.zip
            goarch: amd64
            cc: clang -arch x86_64
          - name: macOS arm64
            os: macos-14
            artifact: codex-quota-dock-macos-arm64
            output: dist/codex-quota-dock-macos-arm64
            upload_path: dist/codex-quota-dock-macos-arm64.zip
            goarch: arm64
            cc: clang
          - name: Linux amd64
            os: ubuntu-latest
            artifact: codex-quota-dock-linux-amd64
            output: dist/codex-quota-dock-linux-amd64
            upload_path: dist/codex-quota-dock-linux-amd64
            goarch: amd64
            cc: gcc

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Windows CGO toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: mingw-w64-x86_64-gcc

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxxf86vm-dev \
            pkg-config \
            xorg-dev

      - name: Generate icon assets
        run: go run ./cmd/generate-icons

      - name: Test
        env:
          CGO_ENABLED: "1"
        run: go test ./...

      - name: Generate Windows executable icon resource
        if: runner.os == 'Windows'
        shell: pwsh
        run: windres -i cmd/codex-quota-dock/app_windows.rc -O coff -o cmd/codex-quota-dock/app_windows.syso

      - name: Build Windows artifact
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: "1"
          GOARCH: ${{ matrix.goarch }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -buildvcs=false -trimpath -ldflags="-s -w -H=windowsgui -X github.com/fearofmissingout/codex-quota-dock/internal/version.Version=0.6.1" -o "${{ matrix.output }}" ./cmd/codex-quota-dock

      - name: Build Linux artifact
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: "1"
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: |
          mkdir -p dist
          go build -buildvcs=false -trimpath -ldflags="-s -w -X github.com/fearofmissingout/codex-quota-dock/internal/version.Version=0.6.1" -o "${{ matrix.output }}" ./cmd/codex-quota-dock

      - name: Build macOS app bundle
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: "1"
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: |
          mkdir -p dist
          go build -buildvcs=false -trimpath -ldflags="-s -w -X github.com/fearofmissingout/codex-quota-dock/internal/version.Version=0.6.1" -o "${{ matrix.output }}" ./cmd/codex-quota-dock
          mkdir -p dist/AppIcon.iconset
          sips -z 16 16 assets/icon/codex-quota-dock.png --out dist/AppIcon.iconset/icon_16x16.png >/dev/null
          sips -z 32 32 assets/icon/codex-quota-dock.png --out dist/AppIcon.iconset/icon_16x16@2x.png >/dev/null
          sips -z 32 32 assets/icon/codex-quota-dock.png --out dist/AppIcon.iconset/icon_32x32.png >/dev/null
          sips -z 64 64 assets/icon/codex-quota-dock.png --out dist/AppIcon.iconset/icon_32x32@2x.png >/dev/null
          sips -z 128 128 assets/icon/codex-quota-dock.png --out dist/AppIcon.iconset/icon_128x128.png >/dev/null
          sips -z 256 256 assets/icon/codex-quota-dock.png --out dist/AppIcon.iconset/icon_128x128@2x.png >/dev/null
          sips -z 256 256 assets/icon/codex-quota-dock.png --out dist/AppIcon.iconset/icon_256x256.png >/dev/null
          sips -z 512 512 assets/icon/codex-quota-dock.png --out dist/AppIcon.iconset/icon_256x256@2x.png >/dev/null
          sips -z 512 512 assets/icon/codex-quota-dock.png --out dist/AppIcon.iconset/icon_512x512.png >/dev/null
          iconutil -c icns dist/AppIcon.iconset -o dist/AppIcon.icns
          go run ./cmd/package-macos-app \
            -binary "${{ matrix.output }}" \
            -app "dist/Codex Quota Dock.app" \
            -version "0.6.1" \
            -build "${{ github.sha }}" \
            -icon "dist/AppIcon.icns"
          codesign --force --deep --sign - "dist/Codex Quota Dock.app"
          ditto -c -k --sequesterRsrc --keepParent "dist/Codex Quota Dock.app" "${{ matrix.upload_path }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.upload_path }}
          if-no-files-found: error

  build-native-macos:
    name: Build native macOS ${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
          - arch: x86_64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test native macOS app
        if: matrix.arch == 'arm64'
        run: |
          cd native/macos/CodexQuotaDock
          swift test

      - name: Package native macOS app
        env:
          VERSION: "0.6.1"
        run: sh ./scripts/package-macos-native.sh "${{ matrix.arch }}"

      - name: Upload native macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-quota-dock-native-macos-${{ matrix.arch }}
          path: dist/codex-quota-dock-native-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  build-native-windows:
    name: Build native Windows amd64
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and test native Windows app
        shell: pwsh
        run: .\scripts\build-windows-native.ps1 -Configuration Release -Arch x64

      - name: Upload native Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-quota-dock-native-windows-amd64
          path: dist/codex-quota-dock-native-windows-amd64.zip
          if-no-files-found: error
